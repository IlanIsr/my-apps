env:
  # Clerk publishable key — public (ships to every browser), so it lives here in
  # plain text. NEXT_PUBLIC_* is inlined at build, hence availability: BUILD. 
  - variable: NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY
    value: pk_test_bW9yZS1kb3J5LTkxOTUuY2xlcmsuYWNjb3VudHMuZGV2JA
    availability:
      - BUILD
      - RUNTIME

  # NOTE: app-1 now deploys on Vercel (Neon Postgres via DATABASE_URL). This
  # Firebase App Hosting config is kept for reference only and is no longer the
  # deploy target — the store no longer uses Firebase.

  - variable: GOOGLE_CLIENT_SECRET
    secret: GOOGLE_CLIENT_SECRET

  - variable: GOOGLE_REFRESH_TOKEN
    secret: GOOGLE_REFRESH_TOKEN

  - variable: CLERK_SECRET_KEY
    secret: CLERK_SECRET_KEY
